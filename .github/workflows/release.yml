name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to publish binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.test
        run: ./test.sh
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=offloader-$GITHUB_REF_NAME-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/release offloader
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: offloader-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" offloader-* --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
